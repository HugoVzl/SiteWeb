<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toit Commun — décidez ensemble, sous le même toit</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>" />
  <link rel="stylesheet" href="toit-commun.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="toit-commun.js" defer></script>
</head>
<body class="min-h-screen bg-stone-100 text-stone-900 antialiased">

  <header class="sticky top-0 z-20 bg-stone-100/90 backdrop-blur border-b border-stone-200">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <span class="w-9 h-9 rounded-xl bg-orange-700 text-white grid place-items-center shadow-sm">
          <i data-lucide="home" class="w-5 h-5"></i>
        </span>
        <div class="leading-tight">
          <div class="font-serif text-lg">Toit&nbsp;Commun</div>
          <div class="text-[10px] uppercase tracking-widest text-stone-500 hidden sm:block">
            Décidez ensemble, sous le même toit
          </div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <ol id="rail" class="flex items-center justify-center gap-1 sm:gap-2 text-[11px] sm:text-xs"></ol>
        <button type="button" data-action="reset" title="Tout recommencer"
          class="w-8 h-8 rounded-full grid place-items-center text-stone-400 hover:text-orange-700 hover:bg-orange-50 transition">
          <i data-lucide="refresh-cw" class="w-4 h-4 pointer-events-none"></i>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="max-w-3xl mx-auto px-4 py-6 sm:py-10 pb-24"></main>

  <footer class="max-w-3xl mx-auto px-4 pb-8 text-center text-[10px] uppercase tracking-widest text-stone-400">
    Toit Commun — trouver un toit qui met tout le monde d'accord
  </footer>

</body>
</html>
